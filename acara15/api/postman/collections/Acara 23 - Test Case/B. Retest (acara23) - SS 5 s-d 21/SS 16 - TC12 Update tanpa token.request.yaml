$kind: http-request
description: "Harapan status: 401 ID diambil dari variabel id_a / id_b atau angka tertulis di URL. Sengaja TANPA header Authorization."
url: "{{host}}/acara23/public/mahasiswa?id={{id_a}}"
method: PUT
headers:
  Content-Type: application/json
queryParams:
  id: "{{id_a}}"
body:
  type: json
  content: |-
    {
      "nim": "230100001",
      "nama": "Nama Diubah",
      "prodi": "TI"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status 401", function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 13000
