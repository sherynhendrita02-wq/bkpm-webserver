$kind: http-request
description: "Harapan status: 200 ID diambil dari variabel id_a / id_b atau angka tertulis di URL."
url: "{{host}}/acara23/public/mahasiswa?id={{id_b}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
queryParams:
  id: "{{id_b}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 14000
