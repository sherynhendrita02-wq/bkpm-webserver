$kind: http-request
url: "{{base_url}}/mahasiswa?id={{id_uji}}"
method: PUT
headers:
  Content-Type: application/json
queryParams:
  id: "{{id_uji}}"
body:
  type: json
  content: |-
    {
      "nim": "{{nim_uji}}",
      "nama": "Tanpa Token",
      "prodi": "TI"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 401", function () { pm.response.to.have.status(401); });
      pm.test("Respons JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 13000
