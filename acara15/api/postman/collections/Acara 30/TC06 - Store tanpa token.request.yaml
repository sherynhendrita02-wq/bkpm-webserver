$kind: http-request
url: "{{base_url}}/mahasiswa"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nim": "123456789",
      "nama": "Tanpa Token",
      "prodi": "TI"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 401", function () { pm.response.to.have.status(401); });
      pm.test("Respons JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 3000
