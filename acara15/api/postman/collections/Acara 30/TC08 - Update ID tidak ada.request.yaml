$kind: http-request
url: "{{base_url}}/mahasiswa?id=999999"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
queryParams:
  id: "999999"
body:
  type: json
  content: |-
    {
      "nim": "{{nim_uji}}",
      "nama": "Tidak Ada",
      "prodi": "TI"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 404", function () { pm.response.to.have.status(404); });
      pm.test("Respons JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 9000
