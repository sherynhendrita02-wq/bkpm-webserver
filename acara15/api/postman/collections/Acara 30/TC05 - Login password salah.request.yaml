$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{admin_username}}",
      "password": "salah123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 401", function () { pm.response.to.have.status(401); });
      pm.test("Respons JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 2000
