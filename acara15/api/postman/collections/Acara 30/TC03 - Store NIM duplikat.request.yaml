$kind: http-request
url: "{{base_url}}/mahasiswa"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "nim": "{{nim_uji}}",
      "nama": "Uji Duplikat",
      "prodi": "TI"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 422", function () { pm.response.to.have.status(422); });
      pm.test("Respons JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 6000
