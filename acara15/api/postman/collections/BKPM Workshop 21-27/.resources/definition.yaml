$kind: collection
description: Satu collection, satu folder per acara. Jalankan 'POST /login' pada folder acara yang sedang dikerjakan agar token tersimpan otomatis. Ubah variabel `host`, `username`, `password`, `admin_username`, `admin_password`, `id_a`, `id_b` pada tab Variables.
variables:
  - key: host
    value: http://localhost/bkpm-webserver
    disabled: false
  - key: username
    value: testuser21
    disabled: false
  - key: password
    value: Belajar123!
    disabled: false
  - key: admin_username
    value: admin
    disabled: false
  - key: admin_password
    value: rahasia123
    disabled: false
  - key: id_a
    value: "1"
    disabled: false
  - key: id_b
    value: "2"
    disabled: false
  - key: token
    value: ""
    disabled: false
  - key: token_admin
    value: ""
    disabled: false
  - key: token_user
    value: ""
    disabled: false
  - key: token_palsu
    value: token.palsu.abc
    disabled: false
  - key: bearer_token_14gs
    secret: true
    disabled: false
  - key: json_web_token_0fc8
    secret: true
    disabled: false
auth:
  - id: 5141c171-d3a7-45cb-937b-98a895d66e53
    type: bearer
    name: Bearer Token
    credentials:
