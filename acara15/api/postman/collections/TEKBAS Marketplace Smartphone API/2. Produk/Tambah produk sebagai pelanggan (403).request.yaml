$kind: http-request
url: "{{base_url}}/api/produk"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nama": "X",
      "merk": "Y",
      "harga": 1,
      "stok": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{pelanggan_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 403', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 8000
