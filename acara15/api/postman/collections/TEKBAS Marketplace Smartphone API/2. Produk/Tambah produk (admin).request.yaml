$kind: http-request
url: "{{base_url}}/api/produk"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nama": "Oppo Reno 11",
      "merk": "Oppo",
      "harga": 6299000,
      "stok": 10,
      "ram_gb": 8,
      "storage_gb": 256,
      "warna": "Hijau",
      "deskripsi": "Kamera potret 50MP"
    }
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', function () { pm.response.to.have.status(201); });
      var j = pm.response.json();
      pm.collectionVariables.set('produk_id', j.data.id);
    language: text/javascript
order: 4000
