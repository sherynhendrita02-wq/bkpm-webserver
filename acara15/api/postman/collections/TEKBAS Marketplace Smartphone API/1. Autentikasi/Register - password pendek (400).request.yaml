$kind: http-request
url: "{{base_url}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nama": "Rina",
      "email": "rina2@example.com",
      "password": "123"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 3000
