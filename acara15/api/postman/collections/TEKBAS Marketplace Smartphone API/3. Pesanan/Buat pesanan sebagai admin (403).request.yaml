$kind: http-request
url: "{{base_url}}/api/pesanan"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": [
        {
          "produk_id": "{{produk_id}}",
          "jumlah": 1
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 403', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 4000
