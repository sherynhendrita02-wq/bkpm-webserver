$kind: http-request
url: "{{base_url}}/api/pesanan"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": [
        {
          "produk_id": "{{produk_id}}",
          "jumlah": 2
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{pelanggan_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', function () { pm.response.to.have.status(201); });
      var j = pm.response.json();
      pm.collectionVariables.set('pesanan_id', j.data.id);
    language: text/javascript
order: 1000
