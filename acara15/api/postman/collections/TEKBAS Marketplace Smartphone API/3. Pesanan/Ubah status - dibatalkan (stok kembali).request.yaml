$kind: http-request
name: Ubah status -> dibatalkan (stok kembali)
url: "{{base_url}}/api/pesanan/{{pesanan_id}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "dibatalkan"
    }
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 9000
