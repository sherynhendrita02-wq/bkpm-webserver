$kind: http-request
url: "{{base_url}}/api/produk/{{produk_id}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 1000
