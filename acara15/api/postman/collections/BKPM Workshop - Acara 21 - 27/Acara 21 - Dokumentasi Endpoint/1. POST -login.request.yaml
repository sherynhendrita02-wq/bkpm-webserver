$kind: http-request
name: 1. POST /login
description: "**AuthController::login()** - Publik. Token otomatis disimpan ke variabel `token`."
url: "{{host}}/acara21/public/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j.success) { pm.collectionVariables.set('token', j.data.token); }
    language: text/javascript
examples: ./.resources/1. POST -login.resources/examples
order: 1000
