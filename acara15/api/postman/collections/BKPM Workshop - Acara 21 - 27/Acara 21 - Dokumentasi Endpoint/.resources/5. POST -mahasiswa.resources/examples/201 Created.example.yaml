$kind: http-example
request:
  url: "{{host}}/acara21/public/mahasiswa"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: json
    content: |-
      {
        "nim": "230100777",
        "nama": "Test Token",
        "prodi": "TI"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Data berhasil ditambahkan",
        "data": {
          "id": "5"
        },
        "errors": [],
        "timestamp": "2026-11-19T06:50:00+07:00"
      }
order: 1000
