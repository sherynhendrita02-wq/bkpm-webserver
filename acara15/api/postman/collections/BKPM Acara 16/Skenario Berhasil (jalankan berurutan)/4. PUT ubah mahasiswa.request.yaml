$kind: http-request
url: "{{base_url}}/mahasiswa/{{id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nim": "{{nim}}",
      "nama": "Dewi Lestari Putri",
      "prodi": "Teknik Informatika",
      "email": "dewi.putri@gmail.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 200', function () { pm.response.to.have.status(200); });
      pm.test('Response berformat JSON', function () { pm.response.to.be.json; });
    language: text/javascript
order: 4000
