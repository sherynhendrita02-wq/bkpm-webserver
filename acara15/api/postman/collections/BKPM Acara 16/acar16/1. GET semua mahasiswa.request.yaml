$kind: http-request
url: "{{base_url}}/mahasiswa"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code 200', function () { pm.response.to.have.status(200); });
      pm.test('Response berformat JSON', function () { pm.response.to.be.json; });
      pm.test('Ada field data', function () { pm.expect(pm.response.json()).to.have.property('data'); });
    language: text/javascript
order: 1000
