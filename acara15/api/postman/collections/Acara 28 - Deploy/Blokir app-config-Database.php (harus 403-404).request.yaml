$kind: http-request
name: Blokir app/config/Database.php (harus 403/404)
description: |-
  Langkah 6.3: berkas kredensial database tidak boleh dapat diakses dari browser (harus 403/404).

  URL memakai `root_url` (folder induk dari public/), karena app/ berada di luar public/.
url: "{{root_url}}/app/config/Database.php"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Tidak dapat diakses (403/404)', () => pm.expect([403, 404]).to.include(pm.response.code));
      const b = pm.response.text();
      pm.test('Isi berkas tidak bocor', () => { pm.expect(b).to.not.include('new PDO'); pm.expect(b).to.not.include('SECRET'); pm.expect(b).to.not.include('<?php'); });
    language: text/javascript
order: 3000
