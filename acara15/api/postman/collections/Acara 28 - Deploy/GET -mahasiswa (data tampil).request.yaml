$kind: http-request
name: GET /mahasiswa (data tampil)
description: "Langkah 6.1: data ditampilkan melalui MahasiswaController::index()."
url: "{{base_url}}/mahasiswa"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Pesan: Data berhasil diambil', () => pm.expect(pm.response.json().message).to.eql("Data berhasil diambil"));
      pm.test('data berupa array', () => pm.expect(pm.response.json().data).to.be.an('array'));
      pm.test('Content-Type JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
    language: text/javascript
order: 2000
