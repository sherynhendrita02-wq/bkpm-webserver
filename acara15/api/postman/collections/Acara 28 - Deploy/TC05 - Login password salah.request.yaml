$kind: http-request
description: |-
  **Skenario:** Login password salah

  **Hasil diharapkan:** 401 Unauthorized

  Password sengaja salah.
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{admin_username}}",
      "password": "salah123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('Pesan: Username atau password salah', () => pm.expect(pm.response.json().message).to.eql("Username atau password salah"));
    language: text/javascript
order: 6000
