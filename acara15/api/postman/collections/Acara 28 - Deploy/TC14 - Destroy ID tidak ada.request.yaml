$kind: http-request
description: |-
  **Skenario:** Destroy ID tidak ada

  **Hasil diharapkan:** 404 Not Found

  id = 999999.
url: "{{base_url}}/mahasiswa?id=999999"
method: DELETE
headers:
  Authorization: Bearer {{token}}
queryParams:
  id: "999999"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('Pesan: Data tidak ditemukan', () => pm.expect(pm.response.json().message).to.eql("Data tidak ditemukan"));
    language: text/javascript
order: 9000
