$kind: http-request
description: |-
  **Skenario:** Destroy token palsu

  **Hasil diharapkan:** 401 Unauthorized

  Token admin diubah (ditambah karakter) sehingga signature tidak cocok.
url: "{{base_url}}/mahasiswa?id={{id_uji}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}x
queryParams:
  id: "{{id_uji}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('Pesan: Token tidak valid atau kedaluwarsa', () => pm.expect(pm.response.json().message).to.eql("Token tidak valid atau kedaluwarsa"));
    language: text/javascript
order: 10000
