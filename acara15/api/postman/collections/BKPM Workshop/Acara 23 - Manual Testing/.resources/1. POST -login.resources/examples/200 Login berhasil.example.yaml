$kind: http-example
request:
  url: "{{host}}/acara23/public/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "username": "{{username}}",
        "password": "{{password}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Login berhasil",
        "data": {
          "token": "eyJhbGci...",
          "role": "user"
        },
        "errors": [],
        "timestamp": "2026-11-19T06:50:00+07:00"
      }
order: 1000
