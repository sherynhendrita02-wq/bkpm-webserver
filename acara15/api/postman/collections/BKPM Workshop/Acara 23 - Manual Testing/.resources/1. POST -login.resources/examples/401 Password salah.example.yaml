$kind: http-example
request:
  url: "{{host}}/acara23/public/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "username": "{{username}}",
        "password": "{{password}}"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Username atau password salah",
        "data": null,
        "errors": [],
        "timestamp": "2026-11-19T06:50:00+07:00"
      }
order: 2000
