$kind: http-example
request:
  url: "{{host}}/acara21/public/mahasiswa"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: json
    content: |-
      {
        "nim": "230100777",
        "nama": "Test Token",
        "prodi": "TI"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Token tidak ditemukan",
        "data": null,
        "errors": [],
        "timestamp": "2026-11-19T06:50:00+07:00"
      }
order: 2000
