openapi: 3.0.0
info:
  title: API Sistem Informasi Akademik (MVC)
  description: >
    REST API berbasis PHP Native (arsitektur MVC) untuk pengelolaan data mahasiswa.
    Endpoint tulis (POST, PUT, DELETE) dilindungi JWT Bearer Token dan hanya dapat diakses role admin (RBAC).
  version: 1.1.0
servers:
  - url: https://
    description: Server produksi (cPanel, HTTPS/AutoSSL) - ganti dengan domain sebenarnya
  - url: http://localhost/bkpm-webserver/acara30/public
    description: Server lokal (XAMPP/Laragon)
tags:
  - name: Autentikasi
    description: Registrasi dan login (AuthController)
  - name: Mahasiswa
    description: CRUD data mahasiswa (MahasiswaController)
paths:
  /register:
    post:
      tags: [Autentikasi]
      summary: Pendaftaran pengguna baru (AuthController::register)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validasi gagal (field kosong / format email tidak valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '409':
          description: Username atau email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /login:
    post:
      tags: [Autentikasi]
      summary: Autentikasi pengguna (AuthController::login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil, token JWT dikembalikan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /mahasiswa:
    get:
      tags: [Mahasiswa]
      summary: Mengambil data mahasiswa (MahasiswaController::index)
      description: Tanpa parameter `id` mengembalikan seluruh data; dengan `id` mengembalikan satu data.
      parameters:
        - name: id
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Data berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MahasiswaListResponse'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Mahasiswa]
      summary: Menambahkan data mahasiswa (MahasiswaController::store)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MahasiswaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MahasiswaFormRequest'
      responses:
        '201':
          description: Data berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Body tidak valid / field wajib kosong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Token tidak ditemukan, tidak valid, atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Akses ditolak, hanya role admin yang diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Format NIM tidak valid (harus 9 digit) atau NIM duplikat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      tags: [Mahasiswa]
      summary: Memperbarui data mahasiswa (MahasiswaController::update)
      description: >
        Untuk pembaruan yang menyertakan foto (multipart), kirim sebagai POST /mahasiswa?id={id}&_method=PUT
        karena PHP tidak membaca multipart pada method PUT.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MahasiswaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MahasiswaFormRequest'
      responses:
        '200':
          description: Data berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: ID tidak valid / field wajib kosong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Token tidak ditemukan, tidak valid, atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Akses ditolak, hanya role admin yang diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Format NIM tidak valid (harus 9 digit) atau NIM duplikat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags: [Mahasiswa]
      summary: Menghapus data mahasiswa (MahasiswaController::destroy)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Data berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: ID tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Token tidak ditemukan, tidak valid, atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Akses ditolak, hanya role admin yang diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT dari endpoint /login (berlaku 5 menit). Kirim melalui header `Authorization Bearer <token>`.
  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, example: budi }
        email: { type: string, format: email, example: budi@example.com }
        password: { type: string, format: password, example: rahasia123 }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, format: password, example: rahasia123 }
    MahasiswaRequest:
      type: object
      required: [nim, nama, prodi]
      properties:
        nim: { type: string, pattern: '^[0-9]{9}$', example: '230100777' }
        nama: { type: string, example: Test Token }
        prodi: { type: string, example: TI }
    MahasiswaFormRequest:
      type: object
      required: [nim, nama, prodi]
      properties:
        nim: { type: string, pattern: '^[0-9]{9}$', example: '230100777' }
        nama: { type: string }
        prodi: { type: string }
        foto:
          type: string
          format: binary
          description: Berkas gambar JPG/PNG, maksimal 2MB
    Mahasiswa:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nim: { type: string, example: '230100777' }
        nama: { type: string, example: Test Token }
        prodi: { type: string, example: TI }
        foto: { type: string, nullable: true, example: foto_65f1a2b3c4d5e6.12345678.png }
        created_at: { type: string, example: '2026-11-16 20:00:00' }
    ApiResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          nullable: true
        errors:
          type: object
          additionalProperties: { type: string }
        timestamp: { type: string, format: date-time }
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token: { type: string }
                role: { type: string, enum: [admin, user] }
    MahasiswaListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Mahasiswa'
